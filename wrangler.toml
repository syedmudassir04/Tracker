name = "tracker"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "job-radar-db"
database_id = "10ffe85c-fec8-4225-8a4d-f719a13b71b5"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
# 02:30 UTC = 08:00 IST Gmail reply check, 13:30 UTC = 19:00 IST sync.
crons = ["30 2 * * *", "30 13 * * *"]
